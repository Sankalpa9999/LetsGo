{% extends "partial/base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Edit Profile</h2>
                </div>
                
                <div class="card-body">
                    <!-- Profile Update Section -->
                    <div class="mb-5">
                        <div class="d-flex align-items-center mb-4">
                            <div class="flex-grow-1">
                                <h4 class="text-primary">
                                    <i class="fas fa-user-edit me-2"></i>Profile Information
                                </h4>
                            </div>
                        </div>
                        
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            {{ profile_form|crispy }}
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <button type="submit" name="save_profile" class="btn btn-primary px-4">
                                    <i class="fas fa-save me-2"></i>Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    <hr class="my-5">
                    
                    <!-- Password Change Section -->
                    <div class="mt-5">
                        <div class="d-flex align-items-center mb-4">
                            <div class="flex-grow-1">
                                <h4 class="text-warning">
                                    <i class="fas fa-key me-2"></i>Password Settings
                                </h4>
                            </div>
                        </div>
                        
                        <form method="POST">
                            {% csrf_token %}
                            {{ password_form|crispy }}
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <button type="submit" name="change_password" class="btn btn-warning px-4">
                                    <i class="fas fa-lock me-2"></i>Change Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="card-footer bg-light text-muted text-center">
                    <small>Last updated: {% now "F j, Y" %}</small>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border-radius: 15px;
        overflow: hidden;
    }
    .card-header {
        border-radius: 15px 15px 0 0 !important;
    }
    .form-control:focus {
        border-color: #4e73df;
        box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
    }
    hr {
        border-top: 2px dashed #dee2e6;
    }
    @media (max-width: 768px) {
        .card-body {
            padding: 1.5rem;
        }
    }
</style>
{% endblock %}
