

{% extends 'partial/base.html' %}
{% load static %}

{% block content %}
<div class="container py-5 text-center">
    <img src="{{ profile.image.url }}" alt="Profile Picture" class="rounded-circle" width="150">
    <h3>{{ profile.full_name|default:request.user.username }}</h3>
    <p>{{ profile.bio }}</p>
    <p><strong>Email:</strong> {{ request.user.email }}</p>
    <p><strong>Phone:</strong> {{ profile.phone }}</p>
    <a href="{% url 'userauths:edit_profile' %}" class="btn btn-outline-primary mt-3">Edit Profile</a>
</div>
{% endblock %}
