{% extends "partial/base.html" %}

{% load static %}

{% block content %}


<div class="container py-5">
    <div class="row">
        <div class="col-md-6">
            <h2 class="mb-4">Contact Us</h2>


            


            <form method="POST">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name"
                        value="{{ initial_data.name|default:'' }}" required
                        placeholder="{% if initial_data.name %}Logged in as {{ initial_data.name }}{% else %}Enter your name{% endif %}">
                </div>
                <div class="form-group mb-3">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                        value="{{ initial_data.email|default:'' }}" required
                        placeholder="{% if initial_data.email %}Your account email{% else %}Enter your email{% endif %}">
                </div>
                <div class="form-group mb-3">
                    <label for="phone">Phone (Optional)</label>
                    <input type="text" class="form-control" id="phone" name="phone"
                        value="{{ initial_data.phone|default:'' }}"
                        placeholder="{% if initial_data.phone %}Your profile phone{% else %}Enter your phone number{% endif %}">
                </div>
                <div class="form-group mb-3">
                    <label for="subject">Subject</label>
                    <input type="text" class="form-control" id="subject" name="subject" required
                        placeholder="What's this about?">
                </div>
                <div class="form-group mb-3">
                    <label for="message">Message</label>
                    <textarea class="form-control" id="message" name="message" rows="5" required
                        placeholder="How can we help you?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>

        <div class="col-md-6">
            <h2 class="mb-4">Our Location</h2>
            <div class="map-container" style="height: 400px;">
                <!-- Google Map Embed -->
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2741.930909492506!2d83.9986623190742!3d28.221565105154664!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x399594365cfa00c1%3A0x55d3cdde5726308!2sInfomax%20College%20of%20Information%20Technology%20and%20Management!5e1!3m2!1sen!2snp!4v1745248470359!5m2!1sen!2snp"
                    width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>

            </div>

            <div class="mt-4">
                <h4>Contact Information</h4>
                <p><i class="fas fa-map-marker-alt"></i> Pokhara, Nepal</p>
                <p><i class="fas fa-phone"></i> +977 061 00000</p>
                <p><i class="fas fa-envelope"></i> letsgo@gmail.com</p>
            </div>
        </div>
    </div>
</div>


<script>
    document.addEventListener('DOMContentLoaded', function () {
      const toastElList = [].slice.call(document.querySelectorAll('.toast'))
      toastElList.map(function (toastEl) {
        new bootstrap.Toast(toastEl, { delay: 3000 }).show();
      });
    });
  </script>
  


{%endblock%}
