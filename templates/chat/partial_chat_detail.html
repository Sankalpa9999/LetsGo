<!-- chat/partial_chat_detail.html -->
<h2>Chat with {{ user.username }}</h2>

<div style="border:1px solid #ccc; padding:10px; height:300px; overflow-y:scroll;" id="chat-messages">
    {% for message in messages %}
        <div style="margin-bottom:10px;">
            <strong>{% if message.sender == request.user %}You{% else %}{{ message.sender.username }}{% endif %}:</strong>
            {{ message.message }}
            <small style="color:gray;">{{ message.timestamp|date:"H:i" }}</small>
        </div>
    {% endfor %}
</div>

<form id="chat-form" method="POST" style="margin-top:20px;">
    {% csrf_token %}
    <textarea name="message" rows="2" style="width:100%;" placeholder="Type your message..."></textarea><br>
    <button type="submit">Send</button>
</form>
