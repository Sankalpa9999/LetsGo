{% extends 'partial/base.html' %}
{% block content %}
<h2 class="my-4">My Wishlist</h2>
<div class="row">
    {% for item in wishlist_items %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <img src="{{ item.product.image.url }}" class="card-img-top" alt="{{ item.product.title }}">
            <div class="card-body">
                <h5 class="card-title">{{ item.product.title }}</h5>
                <p class="card-text">{{ item.product.description|truncatewords:20 }}</p>
                <a href="{% url 'product_detail' item.product.id %}" class="btn btn-primary">View Product</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p>You have no items in your wishlist.</p>
    {% endfor %}
</div>
{% endblock %}
