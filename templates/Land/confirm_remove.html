{% extends 'partial/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="card shadow">
        <div class="card-body text-center py-5">
            <h3>Confirm Removal</h3>
            <p>Are you sure you want to remove "{{ item.item }}" from your rent list?</p>
            
            <form method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2">Yes, Remove</button>
            </form>
            
            <a href="{% url 'rentlist' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
