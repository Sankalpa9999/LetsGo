{% extends 'Partial/base.html' %}
{% block title %}Contact{% endblock %}

{% block content %}

<div class="container my-5">
    <div class="review-container text-center">
        <!-- Button to trigger review form toggle -->
        <button class="btn btn-primary mb-4" id="toggle-review-form">Add Review</button>

        <form id="review-form" class="mt-3 bg-white p-4 shadow rounded" method="post" action="" style="display: none;">
            {% csrf_token %}
            <h4 class="mb-3">Leave a Review</h4>

            <div class="mb-3">
                <label for="rating" class="form-label">Rating:</label>
                <select name="rating" id="rating" class="form-select" required>
                    <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
                    <option value="4">⭐⭐⭐⭐ - Good</option>
                    <option value="3">⭐⭐⭐ - Average</option>
                    <option value="2">⭐⭐ - Poor</option>
                    <option value="1">⭐ - Terrible</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="review" class="form-label">Your Review:</label>
                <textarea name="review" id="review" class="form-control" rows="4" placeholder="Write your thoughts here..." required></textarea>
            </div>

            <button type="submit" class="btn btn-success w-100">Submit Review</button>
        </form>
    </div>
</div>

<script>
    // JavaScript to toggle form visibility
    document.getElementById('toggle-review-form').addEventListener('click', function() {
        const reviewForm = document.getElementById('review-form');
        // Toggle display style between none and block
        reviewForm.style.display = reviewForm.style.display === 'none' ? 'block' : 'none';
    });
</script>

{% endblock %}
