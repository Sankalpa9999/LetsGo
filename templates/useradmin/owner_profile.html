{% extends 'partial/adminbase.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header bg-white">
                    <h4 class="card-title">My Profile</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 text-center">
                            <div class="profile-pic-container mb-4">
                                <img src="{{ vendor.image.url }}" alt="Profile Picture" class="img-thumbnail rounded-circle" width="150">
                            </div>
                            <a href="{% url 'useradmin:edit-owner-profile' %}" class="btn btn-primary btn-sm">
                                <i class="fas fa-edit mr-2"></i>Edit Profile
                            </a>
                        </div>
                        
                        <div class="col-md-9">
                            <div class="profile-details">
                                <h3 class="text-primary mb-4">{{ vendor.title }}</h3>
                                
                                <div class="profile-info mb-4">
                                    <div class="info-item mb-3">
                                        <h5 class="text-muted mb-2">Address</h5>
                                        <p class="mb-0">{{ vendor.address }}</p>
                                    </div>
                                    
                                    <div class="info-item mb-3">
                                        <h5 class="text-muted mb-2">Contact</h5>
                                        <p class="mb-0">{{ vendor.contact }}</p>
                                    </div>
                                    
                                    <div class="info-item">
                                        <h5 class="text-muted mb-2">Description</h5>
                                        <div class="description-box p-3 bg-light rounded">
                                            {{ vendor.description|safe }}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .profile-pic-container {
        border: 5px solid #f8f9fa;
        border-radius: 50%;
        width: 160px;
        height: 160px;
        margin: 0 auto;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .description-box {
        min-height: 100px;
        border-left: 3px solid #4e73df;
    }
    
    .info-item h5 {
        font-size: 0.9rem;
        font-weight: 600;
    }
    
    .card-header {
        border-bottom: 1px solid rgba(0,0,0,.125);
    }
</style>
{% endblock %}
